# Monthly NVD sync — turn freshly-published CVEs on Bowire's multi-protocol
# surfaces into deduplicated tracking issues for templates that don't exist
# yet. Runs scripts/nvd-sync.mjs; see that file for the full flow.
#
# The job never writes a template — it opens `nvd-sync`-labelled issues a
# maintainer triages. Re-runs skip any CVE that already has such an issue or a
# covering template, so a monthly cadence doesn't spam.
#
# The run files only the top N by severity (NVD_SYNC_MAX_ISSUES, default 8).
# Keyword hits are dominated by library-internal CVEs Bowire can't probe, so
# the un-opened tail is dropped on purpose — it is NOT queued for the next run
# (that run's window starts `days` before itself). To sweep further back, use
# workflow_dispatch with a larger `days` value.
#
# NVD_API_KEY (optional org/repo secret) raises the NVD rate limit; the script
# works without it, just slower. GITHUB_TOKEN (issues: write) opens the issues.

name: NVD sync

on:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Print the plan without opening issues'
        type: boolean
        default: false
      days:
        description: 'Lookback window in days (NVD max 120)'
        required: false
        default: '30'

permissions:
  issues: write
  # The run records the candidates the cap left behind in nvd-pending.json and
  # commits it, so they re-enter the next run's pool instead of falling out of
  # the lookback window. Without write access the tail would be discarded
  # again — silently, which is what it used to do.
  contents: write

concurrency:
  group: nvd-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Sync NVD → tracking issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          NVD_SYNC_DAYS: ${{ github.event.inputs.days || '30' }}
        run: |
          if [ "${{ github.event.inputs.dry-run }}" = "true" ]; then
            node scripts/nvd-sync.mjs --dry-run
          else
            node scripts/nvd-sync.mjs
          fi

      # The ledger only works if it survives the run that wrote it. A dry run
      # never writes one, and a run that opened everything it found leaves the
      # file unchanged — both end here with nothing to do, which is why this
      # checks for a diff rather than committing unconditionally.
      - name: Commit the carry-forward ledger
        if: ${{ github.event.inputs.dry-run != 'true' }}
        run: |
          if git diff --quiet -- nvd-pending.json; then
            echo "No change to nvd-pending.json."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nvd-pending.json
          git commit -m "chore(nvd-sync): carry forward the candidates the cap did not open

          Written by scripts/nvd-sync.mjs. These re-enter the pool on the next
          run — the cap limits issues per run, not what stays knowable."
          git push
